name: Daily data update

on:
  schedule:
    - cron: "17 18 * * *"   # ~04:17 AEST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: dataout
        continue-on-error: true

      - name: Init data branch if missing
        run: |
          if [ ! -d dataout/.git ]; then
            mkdir -p dataout
            cd dataout
            git init -b data
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        working-directory: pipeline
        run: python -m goldpipe.cli all --out ../dataout/v1 --state ../dataout/state

      - name: Commit and push data branch
        working-directory: dataout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # First run: checkout of the missing data branch leaves an unborn
          # default branch; make sure the commit lands on 'data'.
          git checkout -B data 2>/dev/null || git symbolic-ref HEAD refs/heads/data
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -u origin data
